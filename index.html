<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きぶん駄菓子屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style id="app-style">
:root{
  --ground:#EEF4F1; --paper:#FFFFFF; --ink:#1D2630; --muted:#56666D; --line:#D3DDD9;
  --red:#D23A41; --red-ink:#FFFFFF; --copper:#9C5A26; --yellow:#F3C63D; --yellow-ink:#2A2206;
  --blue:#2C6AA8; --chip:#E3ECE8; --shadow:0 1px 0 rgba(29,38,48,.08),0 8px 24px -12px rgba(29,38,48,.25);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#11181C; --paper:#1A2328; --ink:#E9F0EE; --muted:#9AA9AE; --line:#2B373D;
    --red:#EE6268; --red-ink:#1A0C0D; --copper:#E2A06A; --yellow:#F0C43E; --yellow-ink:#2A2206;
    --blue:#83B6E8; --chip:#223036; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#11181C; --paper:#1A2328; --ink:#E9F0EE; --muted:#9AA9AE; --line:#2B373D;
  --red:#EE6268; --red-ink:#1A0C0D; --copper:#E2A06A; --yellow:#F0C43E; --yellow-ink:#2A2206;
  --blue:#83B6E8; --chip:#223036; --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font:500 15px/1.7 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  padding-inline:16px; padding-block:0 96px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto}
.display{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;letter-spacing:.01em}
.hand{font-family:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600}

/* header: shop awning */
.awning{height:14px;margin-inline:-16px;background:repeating-linear-gradient(90deg,var(--red) 0 36px,var(--paper) 36px 72px);}
header.shop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 8px}
.sign h1{margin:0;font-size:clamp(34px,6vw,54px);line-height:1.05;text-wrap:balance}
.sign p{margin:8px 0 0;color:var(--muted);max-width:40em}
.owner-toggle{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.owner-toggle[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* main counter */
.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;margin-top:24px;align-items:start}
@media (max-width:820px){.counter{grid-template-columns:1fr}}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 0 10px;font-weight:700}
h2.q{font-size:26px;margin:0 0 16px;line-height:1.3}
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.mood{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;transition:transform .12s,border-color .12s}
.mood:hover{border-color:var(--ink)}
.mood .k{font-family:"Dela Gothic One",sans-serif;font-size:24px;line-height:1;width:32px;text-align:center;color:var(--copper)}
.mood .t{font-size:13.5px;line-height:1.35;font-weight:700}
.mood[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.mood[aria-pressed="true"] .k{color:var(--yellow)}
.budget{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;align-items:center}
.budget .label{margin:0 6px 0 0}
.seg{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.seg[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}

/* the price-tag card */
.tag{position:relative;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:28px 26px 24px;border:1.5px solid var(--line)}
.tag::before{content:"";position:absolute;top:18px;right:22px;width:14px;height:14px;border-radius:50%;background:var(--ground);border:1.5px solid var(--line)}
.tag .for{font-size:13px;color:var(--muted);font-weight:700}
.tag h3{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:6px 0 2px;text-wrap:balance;padding-right:96px}
.tag .maker{color:var(--muted);font-size:13px}
.price{position:absolute;top:44px;right:20px;width:84px;height:84px;border-radius:50%;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;transform:rotate(8deg);text-align:center;line-height:1}
.price b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.price small{font-size:13px;font-weight:700;display:block;margin-top:2px}
.price .mey{font-size:10px;font-weight:700;opacity:.75;display:block;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{font-size:12px;font-weight:700;background:var(--chip);border-radius:999px;padding:2px 10px}
.love{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}
.love .hearts{letter-spacing:2px;color:var(--red);font-size:16px}
.words{margin-top:16px;border-top:2px dashed var(--line);padding-top:16px}
.words .who{font-size:12px;letter-spacing:.12em;color:var(--copper);font-weight:700}
.words p{margin:6px 0 0;font-size:19px;line-height:1.7}
.sample{display:inline-block;margin-left:8px;font-size:10.5px;letter-spacing:.06em;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;vertical-align:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--ground);border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn:disabled{opacity:.45;cursor:default}
.also{margin-top:18px}
.also-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.also-list{grid-template-columns:1fr}}
.mini{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mini:hover{border-color:var(--ink)}
.mini span{font-weight:700;font-size:13.5px;line-height:1.35}
.mini em{font-style:normal;color:var(--copper);font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:20px 0}

/* bag */
section.block{margin-top:56px}
.block-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.block-head h2{margin:0;font-size:26px;line-height:1.25}
.block-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.bag{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:22px}
@media (max-width:720px){.bag{grid-template-columns:1fr}}
.bag ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.bag li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line)}
.bag li b{font-weight:700}
.bag li span{color:var(--copper);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.receipt{background:var(--ground);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start;font-variant-numeric:tabular-nums}
.receipt div{display:flex;justify-content:space-between}
.receipt .total{font-family:"Dela Gothic One",sans-serif;font-size:24px;border-top:2px solid var(--ink);padding-top:8px;margin-top:4px}

/* zukan */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.search{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;min-width:0;width:220px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start;text-align:left}
.card:hover{border-color:var(--ink)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .n{font-weight:700;font-size:15.5px;line-height:1.35}
.card .p{color:var(--copper);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .c{font-size:13px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .h{color:var(--red);font-size:12px;letter-spacing:1px}
.edit-link{border:none;background:none;color:var(--blue);font-weight:700;font-size:13px;padding:2px 0}
.add-card{border:2px dashed var(--line);background:transparent;border-radius:14px;min-height:110px;font-weight:700;color:var(--muted)}
.add-card:hover{border-color:var(--ink);color:var(--ink)}

footer{margin-top:56px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:16px}

/* owner bar + dialog */
.ownerbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--ground);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;z-index:10}
.ownerbar .msg{font-size:14px;font-weight:700}
.ownerbar .btn{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.ownerbar .btn.ghost{background:transparent;color:var(--ground);border-color:var(--ground)}
.notice{margin-top:16px;background:var(--paper);border:1.5px solid var(--yellow);border-radius:12px;padding:12px 16px;font-size:14px}
dialog{border:none;border-radius:18px;padding:0;background:var(--paper);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,18,.5)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h3{margin:0;font-size:22px}
.field{display:grid;gap:4px}
.field label,.field .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea{border:1.5px solid var(--line);background:var(--ground);border-radius:10px;padding:8px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical;font-family:"Klee One",serif;font-weight:600;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink);font-weight:700}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.hint{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hearts(n) { var s = ""; for (var i = 0; i < 5; i++) s += i < n ? "♥" : "♡"; return s; }
  function byId(id) { return data.items.filter(function (i) { return i.id === id; })[0]; }
  function candidates() {
    return data.items.filter(function (i) {
      return i.moods.indexOf(state.mood) !== -1 && (!state.budget || i.price <= state.budget);
    });
  }
  // Weighted by 偏愛度: 店主のお気に入りほど出やすい
  function weighted(pool) {
    var total = 0;
    pool.forEach(function (i) { total += Math.pow(i.love || 1, 1.6); });
    var r = Math.random() * total;
    for (var j = 0; j < pool.length; j++) {
      r -= Math.pow(pool[j].love || 1, 1.6);
      if (r <= 0) return pool[j];
    }
    return pool[pool.length - 1];
  }
  function recommend() {
    var list = candidates();
    if (!list.length) { state.pickId = null; return; }
    var pool = list.filter(function (i) { return state.seen.indexOf(i.id) === -1; });
    if (!pool.length) { state.seen = state.pickId ? [state.pickId] : []; pool = list.filter(function (i) { return i.id !== state.pickId; }); }
    if (!pool.length) pool = list;
    var p = weighted(pool);
    state.pickId = p.id;
    state.seen.push(p.id);
  }
  // 予算内のつめあわせ（同じ駄菓子は2個まで）
  function makeBag() {
    var budget = state.bag, left = budget, bag = [];
    var mood = data.items.filter(function (i) { return i.moods.indexOf(state.mood) !== -1; });
    var rest = data.items.filter(function (i) { return i.moods.indexOf(state.mood) === -1 && (i.love || 0) >= 4; });
    function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    function fill(list, max) {
      shuffle(list).sort(function (a, b) { return (b.love || 0) - (a.love || 0); }).forEach(function (it) {
        var row = bag.filter(function (b) { return b.item.id === it.id; })[0];
        while (left >= it.price && (!row || row.n < max)) {
          if (!row) { row = { item: it, n: 0 }; bag.push(row); }
          row.n++; left -= it.price;
          if (budget <= 100) break;
        }
      });
    }
    fill(mood, 2); fill(rest, 1); fill(mood, 2);
    return { rows: bag, total: budget - left, left: left };
  }

  // ---------- render ----------
  var root = document.getElementById("root");
  function render() {
    var pick = state.pickId && byId(state.pickId);
    var list = candidates();
    var mood = MOOD_BY_ID[state.mood];
    var hasSample = data.items.some(function (i) { return i.sample; });
    var h = "";
    h += '<div class="awning" aria-hidden="true"></div><div class="wrap">';
    h += '<header class="shop"><div class="sign"><h1 class="display">' + esc(data.shop.name) + "</h1><p>" + esc(data.shop.intro) + "</p></div>";
    if (state.canOwn) h += '<button class="owner-toggle" id="owner-toggle" aria-pressed="' + state.owner + '">' + (state.owner ? "店主モード中" : "店主モード") + "</button>";
    h += "</header>";
    if (state.owner && state.restore) h += '<div class="notice">前回、公開できなかった変更が残っています。<button class="edit-link" id="restore">変更を戻す</button> ／ <button class="edit-link" id="discard-restore">捨てる</button></div>';
    if (state.owner && hasSample) h += '<div class="notice">「見本」マークのひとことは仮の文章です。図鑑の「編集」から、' + esc(data.shop.owner) + "さん自身の言葉に書き換えてください。</div>";

    h += '<div class="counter"><div>';
    h += '<p class="label">STEP 1</p><h2 class="q display">いまの気分は？</h2><div class="moods" role="group" aria-label="気分">';
    MOODS.forEach(function (m) {
      h += '<button class="mood" data-mood="' + m.id + '" aria-pressed="' + (m.id === state.mood) + '"><span class="k" aria-hidden="true">' + m.k + '</span><span class="t">' + m.t + "</span></button>";
    });
    h += '</div><div class="budget" role="group" aria-label="予算"><span class="label">予算</span>';
    BUDGETS.forEach(function (b) { h += '<button class="seg" data-budget="' + b.v + '" aria-pressed="' + (b.v === state.budget) + '">' + b.l + "</button>"; });
    h += "</div></div>";

    h += '<div><p class="label">STEP 2 ・ 店主のおすすめ</p>';
    if (pick) {
      h += '<article class="tag pop" aria-live="polite"><div class="for">「' + esc(mood.t) + "」なあなたに</div>";
      h += '<h3 class="display">' + esc(pick.name) + '</h3><div class="maker">' + esc(pick.maker || " ") + "</div>";
      h += '<div class="price" aria-label="' + pick.price + '円（目安）"><div><b>' + pick.price + '</b><small>円</small><span class="mey">目安</span></div></div>';
      h += '<div class="tags">' + pick.tastes.map(function (t) { return '<span class="pill">' + esc(t) + "</span>"; }).join("") + "</div>";
      h += '<div class="love">店主の偏愛度 <span class="hearts" aria-label="5段階中' + pick.love + '">' + hearts(pick.love) + "</span></div>";
      h += '<div class="words"><div class="who">' + esc(data.shop.owner) + "のひとこと" + (pick.sample ? '<span class="sample">見本</span>' : "") + '</div><p class="hand">' + esc(pick.comment) + "</p></div>";
      h += '<div class="actions"><button class="btn" id="reroll"' + (list.length < 2 ? " disabled" : "") + ">ほかのにする</button>";
      if (state.owner) h += '<button class="btn ghost" data-edit="' + pick.id + '">この駄菓子を編集</button>';
      h += "</div></article>";
      var others = list.filter(function (i) { return i.id !== pick.id; }).sort(function (a, b) { return b.love - a.love; }).slice(0, 3);
      if (others.length) {
        h += '<div class="also"><p class="label">この気分なら、こっちも</p><div class="also-list">';
        others.forEach(function (o) { h += '<button class="mini" data-pick="' + o.id + '"><span>' + esc(o.name) + "</span><em>" + o.price + "円</em></button>"; });
        h += "</div></div>";
      }
    } else {
      h += '<div class="tag"><p class="empty">この気分と予算に合う駄菓子が、まだ図鑑にありません。予算を「気にしない」にしてみてください。</p></div>';
    }
    h += "</div></div>";

    // bag
    var bag = makeBag();
    h += '<section class="block"><div class="block-head"><div><h2 class="display">' + state.bag + "円でつめあわせ</h2><p>「" + esc(mood.t) + "」を中心に、店主のお気に入りで紙袋をいっぱいにします。</p></div>";
    h += '<div class="budget" role="group" aria-label="つめあわせの予算" style="margin:0">';
    [100, 300].forEach(function (v) { h += '<button class="seg" data-bag="' + v + '" aria-pressed="' + (state.bag === v) + '">' + v + "円" + (v === 300 ? "（遠足ルール）" : "") + "</button>"; });
    h += '<button class="btn ghost" id="rebag" style="padding:4px 12px;font-size:13px">つめなおす</button></div></div>';
    h += '<div class="bag"><ol>';
    bag.rows.forEach(function (r) { h += '<li><b>' + esc(r.item.name) + (r.n > 1 ? " ×" + r.n : "") + "</b><span>" + r.item.price * r.n + "円</span></li>"; });
    if (!bag.rows.length) h += '<li class="empty">図鑑に駄菓子がありません</li>';
    h += '</ol><div class="receipt"><div><span>予算</span><span>' + state.bag + "円</span></div><div><span>品数</span><span>" + bag.rows.reduce(function (a, r) { return a + r.n; }, 0) + '個</span></div><div class="total"><span>合計</span><span>' + bag.total + "円</span></div><div><span>おつり</span><span>" + bag.left + "円</span></div></div></div></section>";

    // zukan
    var tastes = [];
    data.items.forEach(function (i) { i.tastes.forEach(function (t) { if (tastes.indexOf(t) === -1) tastes.push(t); }); });
    var q = state.q.trim();
    var shown = data.items.filter(function (i) {
      return (!state.taste || i.tastes.indexOf(state.taste) !== -1) && (!q || (i.name + i.maker + i.comment).indexOf(q) !== -1);
    });
    h += '<section class="block"><div class="block-head"><div><h2 class="display">駄菓子図鑑</h2><p>' + esc(data.shop.owner) + "が選んだ " + data.items.length + " 品。タップするとおすすめ欄に表示します。</p></div></div>";
    h += '<div class="filters"><input class="search" id="zukan-search" type="search" placeholder="名前・メーカーで探す" value="' + esc(state.q) + '" aria-label="図鑑を検索">';
    h += '<button class="seg" data-taste="" aria-pressed="' + (!state.taste) + '">すべて</button>';
    tastes.forEach(function (t) { h += '<button class="seg" data-taste="' + esc(t) + '" aria-pressed="' + (state.taste === t) + '">' + esc(t) + "</button>"; });
    h += '</div><div class="grid">';
    if (state.owner) h += '<button class="add-card" id="add-item">＋ 駄菓子を追加</button>';
    shown.forEach(function (i) {
      h += '<div class="card"><div class="top"><button class="n edit-link" style="color:var(--ink);text-align:left;font-size:15.5px" data-pick="' + i.id + '">' + esc(i.name) + '</button><span class="p">' + i.price + "円</span></div>";
      h += '<div class="c">' + esc(i.comment) + "</div>";
      h += '<div class="row"><span class="h" aria-label="偏愛度' + i.love + '">' + hearts(i.love) + "</span>" + (state.owner ? '<button class="edit-link" data-edit="' + i.id + '">編集</button>' : '<span class="pill">' + esc(i.moods.map(function (m) { return MOOD_BY_ID[m] ? MOOD_BY_ID[m].k : ""; }).join("")) + "</span>") + "</div></div>";
    });
    h += "</div>" + (shown.length ? "" : '<p class="empty">見つかりませんでした。</p>') + "</section>";

    h += "<footer>価格はお店や時期で変わるので目安です。" + (hasSample ? "「見本」の付いたひとことは仮の文章です。" : "") + "</footer></div>";

    if (state.owner && dirty) {
      h += '<div class="ownerbar"><span class="msg">未公開の変更があります</span><button class="btn ghost" id="revert">元に戻す</button><button class="btn" id="publish">みんなに公開する</button></div>';
    }
    var focusId = document.activeElement && document.activeElement.id;
    var selStart = focusId === "zukan-search" ? document.activeElement.selectionStart : null;
    root.innerHTML = h;
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f) { f.focus(); if (selStart != null && f.setSelectionRange) f.setSelectionRange(selStart, selStart); }
    }
  }

  // ---------- events ----------
  root.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.mood) { state.mood = t.dataset.mood; state.seen = []; recommend(); render(); return; }
    if (t.dataset.budget != null) { state.budget = +t.dataset.budget; state.seen = []; recommend(); render(); return; }
    if (t.dataset.bag) { state.bag = +t.dataset.bag; render(); return; }
    if (t.dataset.taste != null) { state.taste = t.dataset.taste; render(); return; }
    if (t.dataset.pick) {
      state.pickId = t.dataset.pick; state.seen.push(t.dataset.pick);
      var it = byId(t.dataset.pick);
      if (it && it.moods.indexOf(state.mood) === -1 && it.moods.length) state.mood = it.moods[0];
      render();
      var tag = root.querySelector(".tag");
      if (tag && tag.getBoundingClientRect().top < 0 || (tag && tag.getBoundingClientRect().top > innerHeight)) tag.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    if (t.dataset.edit) { openEditor(t.dataset.edit); return; }
    switch (t.id) {
      case "reroll": recommend(); render(); break;
      case "rebag": render(); break;
      case "owner-toggle": state.owner = !state.owner; render(); break;
      case "add-item": openEditor(null); break;
      case "revert": data = JSON.parse(JSON.stringify(SAVED)); dirty = false; if (!byId(state.pickId)) recommend(); render(); break;
      case "publish": publish(t); break;
      case "restore": data = state.restore; state.restore = null; dirty = true; render(); break;
      case "discard-restore": state.restore = null; try { sessionStorage.removeItem(STASH_KEY); } catch (_) {} render(); break;
    }
  });
  root.addEventListener("input", function (e) {
    if (e.target.id === "zukan-search") { state.q = e.target.value; render(); }
  });

  // ---------- owner editor ----------
  var dlg = document.createElement("dialog");
  dlg.id = "editor";
  document.body.appendChild(dlg);

  function openEditor(id) {
    var it = id ? byId(id) : { id: "", name: "", maker: "", price: 20, tastes: [], moods: [state.mood], love: 3, comment: "" };
    var h = '<form class="dlg" method="dialog" id="editor-form"><h3 class="display">' + (id ? "駄菓子を編集" : "駄菓子を追加") + "</h3>";
    h += '<div class="field"><label for="f-name">名前</label><input id="f-name" required value="' + esc(it.name) + '"></div>';
    h += '<div class="two"><div class="field"><label for="f-maker">メーカー</label><input id="f-maker" value="' + esc(it.maker) + '"></div>';
    h += '<div class="field"><label for="f-price">価格（円）</label><input id="f-price" type="number" min="1" max="9999" inputmode="numeric" required value="' + it.price + '"></div></div>';
    h += '<div class="field"><label for="f-tastes">味・種類（読点で区切る）</label><input id="f-tastes" placeholder="しょっぱい、スナック" value="' + esc(it.tastes.join("、")) + '"></div>';
    h += '<div class="field"><span class="lbl">どんな気分のときにすすめる？</span><div class="checks">';
    MOODS.forEach(function (m) { h += '<label><input type="checkbox" id="f-mood-' + m.id + '" value="' + m.id + '"' + (it.moods.indexOf(m.id) !== -1 ? " checked" : "") + ">" + m.t + "</label>"; });
    h += '</div></div><div class="field"><label for="f-love">偏愛度（1〜5） <span id="f-love-out">' + hearts(it.love) + '</span></label><input id="f-love" type="range" min="1" max="5" step="1" value="' + it.love + '"></div>';
    h += '<div class="field"><label for="f-comment">' + esc(data.shop.owner) + 'のひとこと</label><textarea id="f-comment" placeholder="この駄菓子への想いを一言で">' + esc(it.sample ? "" : it.comment) + "</textarea>" + (it.sample ? '<p class="hint">見本の文章：' + esc(it.comment) + "（空のまま保存すると見本のまま残ります）</p>" : "") + "</div>";
    h += '<details><summary class="hint" style="cursor:pointer">お店の看板を編集</summary><div class="dlg" style="padding:12px 0 0">';
    h += '<div class="field"><label for="f-shop">お店の名前</label><input id="f-shop" value="' + esc(data.shop.name) + '"></div>';
    h += '<div class="field"><label for="f-owner">店主の呼び名</label><input id="f-owner" value="' + esc(data.shop.owner) + '"></div>';
    h += '<div class="field"><label for="f-intro">ひとこと紹介</label><input id="f-intro" value="' + esc(data.shop.intro) + '"></div></div></details>';
    h += '<p class="hint">保存しただけでは公開されません。画面下の「みんなに公開する」で反映されます。</p>';
    h += '<div class="dlg-actions"><div>' + (id ? '<button type="button" class="btn ghost" id="f-delete" style="color:var(--red);border-color:var(--red)">削除</button>' : "") + '</div><div style="display:flex;gap:8px"><button type="button" class="btn ghost" id="f-cancel">やめる</button><button type="submit" class="btn">保存</button></div></div></form>';
    dlg.innerHTML = h;
    var form = dlg.querySelector("form");
    dlg.querySelector("#f-love").addEventListener("input", function (e) { dlg.querySelector("#f-love-out").textContent = hearts(+e.target.value); });
    dlg.querySelector("#f-cancel").addEventListener("click", function () { dlg.close(); });
    var del = dlg.querySelector("#f-delete");
    if (del) del.addEventListener("click", function () {
      if (!confirm("「" + it.name + "」を図鑑から削除しますか？")) return;
      data.items = data.items.filter(function (x) { return x.id !== id; });
      dirty = true; dlg.close();
      if (state.pickId === id) recommend();
      render();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = function (k) { return dlg.querySelector("#" + k).value.trim(); };
      var moods = MOODS.filter(function (m) { return dlg.querySelector("#f-mood-" + m.id).checked; }).map(function (m) { return m.id; });
      if (!moods.length) { alert("すすめる気分を1つ以上えらんでください。"); return; }
      var comment = v("f-comment");
      var next = {
        id: id || ("d-" + Date.now().toString(36)),
        name: v("f-name"), maker: v("f-maker"),
        price: Math.max(1, Math.round(+v("f-price") || 0)),
        tastes: v("f-tastes").split(/[、,，\s]+/).filter(Boolean),
        moods: moods, love: +v("f-love"),
        comment: comment || (it.sample ? it.comment : ""),
        sample: !comment && !!it.sample
      };
      if (!next.sample) delete next.sample;
      if (id) data.items = data.items.map(function (x) { return x.id === id ? next : x; });
      else data.items.unshift(next);
      data.shop = { name: v("f-shop") || data.shop.name, owner: v("f-owner") || data.shop.owner, intro: v("f-intro") };
      dirty = true; dlg.close();
      state.pickId = next.id;
      render();
    });
    dlg.showModal();
  }

  // ---------- publish (page rewrites itself) ----------
  var artifactApi = null;
  function buildDocument(d) {
    var json = JSON.stringify(d).replace(/</g, "\\u003c").replace(/\},\{"id"/g, '},\n{"id"');
    var style = document.getElementById("app-style").outerHTML;
    var script = document.getElementById("app-script").outerHTML;
    return "<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n" +
      TITLE + "\n" + FONTS + "\n" + style + "\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"catalog\">" + json + "</" + "script>\n" + script + "\n</body>\n</html>\n";
  }
  function publish(btn) {
    if (!artifactApi) return;
    btn.disabled = true; btn.textContent = "公開中…";
    try { sessionStorage.setItem(STASH_KEY, JSON.stringify(data)); } catch (_) {}
    artifactApi.publish(buildDocument(data)).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") return; // 最新版に自動で切り替わる。変更は sessionStorage から復元できる
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled") {
        state.canOwn = false; state.owner = false; render();
        alert("このページは閲覧専用で開かれているため、公開できません。");
        return;
      }
      btn.disabled = false; btn.textContent = "みんなに公開する";
      alert(code === "rate_limited" ? "公開が続いています。少し待ってからもう一度押してください。" : "公開できませんでした。少し待ってからもう一度押してください。");
    });
  }

  function initOwner() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
      artifactApi = r[0];
      var user = r[1];
      if (!artifactApi || !user) return;
      return user.canEdit().then(function (ok) {
        if (!ok) return;
        state.canOwn = true;
        try {
          var s = sessionStorage.getItem(STASH_KEY);
          if (s) {
            if (s === JSON.stringify(SAVED)) sessionStorage.removeItem(STASH_KEY);
            else state.restore = JSON.parse(s);
          }
        } catch (_) {}
        render();
      });
    }).catch(function () {});
  }

  recommend();
  render();
  initOwner();
})();
</script>
</body>
</html>
